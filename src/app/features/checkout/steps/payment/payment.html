<div class="payment-step">
      <h2>Select Payment Method</h2>
      <p class="total">Total: {{ currentOrderDetails?.totalAmount  | currency: currentOrderDetails?.currency }}</p>

      <div id="payment-element">
        <!-- All payment methods injected here -->
      </div>

      <div class="actions">
        <button class="back-btn">← Back</button>
        <button class="pay-btn" (click)="pay()">Pay {{ currentOrderDetails?.totalAmount | currency: currentOrderDetails?.currency }}</button>
      </div>
    </div>
