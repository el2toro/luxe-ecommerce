trigger:
- master

pool:
  name: 'Ubuntu-Self-Hosted-Agent'

variables:
  imageName: 'el2toro/luxe-ecommerce'  # Docker Hub repo name

stages:

# --------------------
# 🛠 BUILD STAGE
# --------------------
- stage: Build
  displayName: Build and Push Docker Image
  jobs:
  - job: Build
    pool:
      name: 'Ubuntu-Self-Hosted-Agent'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js 20.x'

    - script: |
        cd luxe-ecommerce/
        npm install -g @angular/cli
        npm install
        ng build --configuration=production
      displayName: 'Build Angular App'

